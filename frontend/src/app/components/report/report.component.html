<div class="main-container">
  <mat-card class="report-card">
    <mat-toolbar class="report-toolbar">
      <h2>Reporte de Evaluaciones</h2>
    </mat-toolbar>

    <div class="report-content">
      <div *ngFor="let item of reportData" class="report-item">
        <mat-card class="evaluation-card">
          <mat-card-header>
            <mat-card-title>Evaluación ID: {{ item.evaluacion }}</mat-card-title>
            <mat-card-subtitle>Pregunta ID: {{ item.pregunta }}</mat-card-subtitle>
          </mat-card-header>

          <mat-card-content>
            <p><strong>Nota:</strong> {{ item.valor }}</p>
            <p *ngIf="item.comentario; else noComment"><strong>Comentario:</strong> {{ item.comentario }}</p>
            <ng-template #noComment>
              <p><em>Sin comentarios</em></p>
            </ng-template>
          </mat-card-content>
        </mat-card>
      </div>
    </div>

    <mat-card-actions class="button-container">
      <button [routerLink]="['/dashboard']" mat-raised-button color="primary">Salir</button>
    </mat-card-actions>
  </mat-card>
</div>
