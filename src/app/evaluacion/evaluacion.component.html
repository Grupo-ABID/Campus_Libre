<div class="container mt-4">
  <h2>Evaluar Cursos</h2>

  <div *ngIf="warningUnrated" class="alert alert-warning">
    Cursos por evaluar.
  </div>

  <form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="courseId" class="form-label">Curso:</label>
      <select formControlName="courseId" id="courseId" class="form-select">
        <option value="">Seleccione un curso</option>
        <option *ngFor="let c of enrolledCourses" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="rating" class="form-label">Nota (1-7):</label>
      <input type="number" class="form-control" id="rating" formControlName="rating" min="1" max="7">
    </div>

    <div class="mb-3">
      <label for="comment" class="form-label">Comentario:</label>
      <textarea class="form-control" id="comment" rows="3" formControlName="comment"></textarea>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!evaluationForm.valid">Enviar Evaluación</button>
  </form>
</div>
